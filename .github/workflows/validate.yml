name: Validate offline assessment
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
      - name: Verify pinned OPA runtime
        run: python -m scubatank.bootstrap --output-dir .build/tools
      - name: Test import, normalization, evaluation, and reports
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build the catalog
        run: python tools/catalog.py
      - name: Run the offline demonstration
        run: python -m scubatank demo --output-dir .build/demo --opa .build/tools/opa
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up pinned local dependencies
        shell: pwsh
        run: ./scripts/Bootstrap.ps1
      - name: Test Python on Windows
        shell: pwsh
        run: ./.venv/Scripts/python.exe -m unittest discover -s tests -p "test_*.py" -v
      - name: Install pinned Pester for test use
        shell: powershell
        run: ./scripts/Install-TestTools.ps1
      - name: Test Windows PowerShell 5.1 operator workflow
        shell: powershell
        run: ./scripts/Test.ps1
      - name: Test PowerShell 7 operator workflow
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Run Windows PowerShell 5.1 demonstration
        shell: powershell
        run: ./scripts/Demo.ps1 -SkipBootstrap -OutputDirectory .build/demo-powershell
      - name: Run PowerShell 7 demonstration
        shell: pwsh
        run: ./scripts/Demo.ps1 -SkipBootstrap -OutputDirectory .build/demo-pwsh
